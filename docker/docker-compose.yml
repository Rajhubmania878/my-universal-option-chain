version: '3.8'

services:
  # 1. High-Performance Options Market Backend (FastAPI + Workers)
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: options_backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=options_market_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - options_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # 2. Historical & Snapshot Database
  postgres:
    image: postgres:16-alpine
    container_name: options_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: options_market_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - options_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d options_market_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Real-time Market Data & Quote Cache
  redis:
    image: redis:7-alpine
    container_name: options_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - options_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. Reverse Proxy & Rate Limiter
  nginx:
    image: nginx:alpine
    container_name: options_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - options_net

networks:
  options_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
